name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            qt_arch: win64_msvc2022_64
            exe: build/Release/x50-patch-switcher.exe
          - name: linux
            os: ubuntu-24.04
            qt_arch: ""
            exe: build/x50-patch-switcher
          - name: macos
            os: macos-15
            qt_arch: ""
            exe: build/x50-patch-switcher
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Linux packages
        if: runner.os == 'Linux'
        # libasound2-dev: RtMidi ALSA backend. The rest: libraries Qt's Gui and
        # its offscreen platform plugin load at runtime.
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libegl1 \
            libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: |
          # The Windows tests load Qt DLLs from the Qt bin dir.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
          fi
          ctest --test-dir build --output-on-failure -C Release

      - name: Smoke (build tree)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$(cygpath -u "$QT_ROOT_DIR")/bin:$PATH"
          fi
          exe="${{ matrix.exe }}"

          # --list-ports exits 0 (an empty list is fine) or 1 if enumeration
          # itself failed. Hosted Linux runners have no ALSA sequencer, so 1 is
          # expected there. Anywhere else it is a failure.
          set +e
          "$exe" --list-ports
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "--list-ports: ok"
          elif [ "$rc" -eq 1 ] && [ "$RUNNER_OS" = "Linux" ]; then
            echo "--list-ports exited 1: ALSA sequencer unavailable on this runner (expected)."
          else
            echo "--list-ports failed with exit code $rc"
            exit 1
          fi

          "$exe" --probe --fake-midi

          diag="$RUNNER_TEMP/diag"
          "$exe" --diagnose "$diag" --fake-midi
          test -s "$diag/report.txt"

      - name: Footprint (Linux)
        if: runner.os == 'Linux'
        run: scripts/measure-footprint.sh

      - name: MSVC developer environment (so windeployqt finds the VC runtime)
        if: runner.os == 'Windows'
        # Sets VCINSTALLDIR; without it windeployqt warns "Cannot find Visual Studio
        # installation directory" and leaves vcruntime140*.dll out of the package.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Stage Windows package
        if: runner.os == 'Windows'
        run: |
          stage=X50-Patch-Switcher
          mkdir "$stage"
          cp build/Release/x50-patch-switcher.exe "$stage/"
          cp "packaging/windows/Diagnose X50.bat" packaging/windows/LEEME.txt \
             packaging/windows/README.txt "$stage/"
          # Copies the Qt DLLs and platform plugins next to the exe. The VC runtime is copied
          # below from the toolset's own redist folder, so windeployqt must not add vc_redist.
          windeployqt --release --no-translations --no-system-d3d-compiler \
            --no-opengl-sw --no-compiler-runtime \
            --skip-plugin-types tls,networkinformation "$stage/x50-patch-switcher.exe"

          # The app links no network module (CLAUDE.md: no network code). Log which binaries
          # import Qt6Network.dll (to learn what pulls it in), then drop it and its plugins and
          # fail if anything still imports it. dumpbin comes from the msvc-dev-cmd step.
          imports_network() { dumpbin -nologo -dependents "$1" | grep -qi 'Qt6Network\.dll'; }
          echo "--- before removal: Qt6Network.dll present: $(test -f "$stage/Qt6Network.dll" && echo yes || echo no)"
          if [ -f "$stage/Qt6Network.dll" ]; then
            while IFS= read -r f; do
              if [ "$f" != "$stage/Qt6Network.dll" ] && imports_network "$f"; then
                echo "imports Qt6Network.dll: $f"
              fi
            done < <(find "$stage" -type f \( -name '*.dll' -o -name '*.exe' \))
          fi
          rm -f "$stage/Qt6Network.dll"
          rm -rf "$stage/tls" "$stage/networkinformation"
          bad=0
          while IFS= read -r f; do
            if imports_network "$f"; then
              echo "STILL imports Qt6Network.dll after removal: $f"
              bad=1
            fi
          done < <(find "$stage" -type f \( -name '*.dll' -o -name '*.exe' \))
          if [ "$bad" != 0 ]; then
            echo "something genuinely needs Qt6Network.dll; do not drop it, find out why"; exit 1
          fi
          echo "no binary in the package imports Qt6Network.dll"
          # The exe must carry the icon and version resources.
          dumpbin -nologo -headers "$stage/x50-patch-switcher.exe" | grep -i 'subsystem'
          # Widgets app: the DirectX shader compiler DLLs are not needed.
          rm -f "$stage/dxcompiler.dll" "$stage/dxil.dll" "$stage/vc_redist.x64.exe"

          # The runtime of the toolset that built the exe (VCToolsRedistDir is set by msvc-dev-cmd),
          # not a glob over every installed version.
          echo "VCToolsRedistDir=${VCToolsRedistDir:-<unset>} VCToolsVersion=${VCToolsVersion:-<unset>}"
          if [ -z "${VCToolsRedistDir:-}" ]; then
            echo "VCToolsRedistDir is not set"; exit 1
          fi
          copied=0
          for crt in "$(cygpath -u "$VCToolsRedistDir")"x64/Microsoft.VC*.CRT; do
            if [ -d "$crt" ]; then
              echo "copying the runtime from $crt"
              cp "$crt"/*.dll "$stage/"
              copied=1
              break
            fi
          done
          if [ "$copied" != 1 ]; then
            echo "no Microsoft.VC*.CRT folder under $VCToolsRedistDir"; exit 1
          fi
          ls -l "$stage"

      - name: Assert the VC runtime is in the package
        if: runner.os == 'Windows'
        # The player's laptop may lack the Visual C++ runtime: the exe must carry it, at least as
        # new as the toolset that built the exe.
        shell: pwsh
        run: |
          $dir = 'X50-Patch-Switcher'
          $bad = $false
          foreach ($f in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll') {
            if (Test-Path (Join-Path $dir $f)) { Write-Host "present: $f" } else { Write-Host "MISSING from ${dir}: $f"; $bad = $true }
          }
          foreach ($f in 'vc_redist.x64.exe', 'dxcompiler.dll', 'dxil.dll', 'Qt6Network.dll') {
            if (Test-Path (Join-Path $dir $f)) { Write-Host "must be absent: $f"; $bad = $true }
          }
          $tool = [version]$env:VCToolsVersion
          Write-Host "VCToolsVersion: $($env:VCToolsVersion) (major.minor $($tool.Major).$($tool.Minor))"
          foreach ($f in 'msvcp140.dll', 'vcruntime140.dll') {
            $path = Join-Path $dir $f
            if (-not (Test-Path $path)) { continue }
            $v = (Get-Item $path).VersionInfo
            $have = [version]('{0}.{1}' -f $v.FileMajorPart, $v.FileMinorPart)
            Write-Host "$f FileVersion $($v.FileVersion) (major.minor $have)"
            if ($have -lt [version]('{0}.{1}' -f $tool.Major, $tool.Minor)) {
              Write-Host "$f is older than the toolset $($env:VCToolsVersion)"; $bad = $true
            }
          }
          Write-Host '--- package files ---'
          Get-ChildItem $dir -Recurse -File | ForEach-Object { '{0,12}  {1}' -f $_.Length, $_.FullName.Substring((Resolve-Path $dir).Path.Length + 1) }
          if ($bad) { exit 1 }

      - name: Smoke (staged package)
        if: runner.os == 'Windows'
        # Qt is deliberately off PATH: a DLL windeployqt missed fails here.
        # Run through cmd with a minimal PATH so the Git bash tools are not needed.
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\system32;%SystemRoot%"
          cd X50-Patch-Switcher
          rem GUI-subsystem exe: cmd does not wait for it, so start /wait (which keeps its exit code).
          start "" /wait x50-patch-switcher.exe --probe --fake-midi
          if errorlevel 1 (echo --probe --fake-midi exited with %ERRORLEVEL% & exit /b 1)
          rem A bad flag must fail with a non-zero code, proving the exit code propagates.
          start "" /wait x50-patch-switcher.exe --no-such-flag
          if %ERRORLEVEL%==0 (echo exit code did not propagate for a bad flag & exit /b 1)
          exit /b 0

      - name: Footprint (staged package)
        if: runner.os == 'Windows'
        # SPEC 5: resident memory under 60 MB after start. Working set is the closest match.
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $cfg = Join-Path $env:RUNNER_TEMP 'footprint-cfg'
          $exe = (Resolve-Path 'X50-Patch-Switcher\x50-patch-switcher.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--fake-midi', '--config-dir', $cfg -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Write-Host "app exited early with $($p.ExitCode)"; exit 1 }
          $p.Refresh()
          $ws = [math]::Round($p.WorkingSet64 / 1MB, 1)
          $priv = [math]::Round($p.PrivateMemorySize64 / 1MB, 1)
          Write-Host "WorkingSet64: $ws MB  PrivateMemorySize64: $priv MB  CPU: $($p.CPU) s  Threads: $($p.Threads.Count)"
          Stop-Process -Id $p.Id -Force
          if ($ws -ge 60) { Write-Host "working set $ws MB is over the SPEC 5 limit of 60 MB"; exit 1 }

      - name: Zip Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $ver = [regex]::Match((Get-Content CMakeLists.txt -Raw), 'project\(x50-patch-switcher VERSION ([0-9.]+)').Groups[1].Value
          if (-not $ver) { Write-Host "version not found in CMakeLists.txt"; exit 1 }
          Compress-Archive -Path X50-Patch-Switcher -DestinationPath "X50-Patch-Switcher-windows-$ver-$sha.zip"
          "ZIP_NAME=X50-Patch-Switcher-windows-$ver-$sha.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Extract the zip into a fresh folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'zipcheck'
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          Expand-Archive -Path $env:ZIP_NAME -DestinationPath $work
          $dir = Join-Path $work 'X50-Patch-Switcher'
          $bad = $false
          foreach ($f in 'x50-patch-switcher.exe', 'Diagnose X50.bat', 'LEEME.txt', 'README.txt',
                         'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'Qt6Core.dll') {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Host "MISSING in the zip: $f"; $bad = $true }
          }
          if ($bad) { exit 1 }
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Smoke (extracted zip, as the player runs it)
        if: runner.os == 'Windows'
        # M3: its --screenshot smoke must run from this extracted zip so qwindows.dll is exercised.
        # Reduced PATH: Windows system folders and Windows PowerShell (the .bat calls powershell),
        # no Qt, no Visual Studio. Diagnose X50.bat is run with NUL as stdin so "pause" returns.
        shell: cmd
        run: |
          set "PATH=%SystemRoot%\system32;%SystemRoot%;%SystemRoot%\System32\WindowsPowerShell\v1.0"
          cd /d "%RUNNER_TEMP%\zipcheck\X50-Patch-Switcher" || exit /b 1
          if exist "%RUNNER_TEMP%\zipdiag" rmdir /s /q "%RUNNER_TEMP%\zipdiag"
          start "" /wait x50-patch-switcher.exe --diagnose "%RUNNER_TEMP%\zipdiag" --fake-midi
          if errorlevel 1 (echo --diagnose --fake-midi exited with %ERRORLEVEL% & exit /b 1)
          if not exist "%RUNNER_TEMP%\zipdiag\report.txt" (echo report.txt missing & exit /b 1)
          echo --- the .bat, against the runner's real WinMM ports (no X50 here) ---
          call "Diagnose X50.bat" < NUL
          echo the .bat finished
          exit /b 0

      - name: Portable mode (extracted zip)
        if: runner.os == 'Windows'
        # SPEC 7.2: a file named "portable" next to the exe keeps config next to the exe.
        # Starts the GUI on the real Windows platform (not offscreen) against the simulated X50,
        # then closes the main window, which saves window.ini into the config directory.
        shell: pwsh
        run: |
          $dir = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'zipcheck\X50-Patch-Switcher')).Path
          $exe = Join-Path $dir 'x50-patch-switcher.exe'
          $roots = @($env:LOCALAPPDATA, $env:APPDATA) | Where-Object { $_ }
          function Find-Ini { $roots | ForEach-Object { Get-ChildItem $_ -Recurse -Filter window.ini -ErrorAction SilentlyContinue } }
          if (Find-Ini) { Write-Host "window.ini already under AppData before the test"; Find-Ini | Format-List FullName }
          $before = @(Find-Ini).Count
          New-Item -ItemType File -Path (Join-Path $dir 'portable') -Force | Out-Null
          Remove-Item (Join-Path $dir 'window.ini') -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          $p = Start-Process -FilePath $exe -ArgumentList '--fake-midi' -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { Write-Host "app exited early with $($p.ExitCode)"; exit 1 }
          $null = $p.CloseMainWindow()
          if (-not $p.WaitForExit(15000)) { Write-Host "the main window did not close"; Stop-Process -Id $p.Id -Force; exit 1 }
          Write-Host "exit code $($p.ExitCode)"
          Get-ChildItem $dir | Where-Object { $_.Extension -in '.ini', '.json' -or $_.Name -eq 'portable' } | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $dir 'window.ini'))) { Write-Host "window.ini did not appear next to the exe"; exit 1 }
          if (@(Find-Ini).Count -ne $before) { Write-Host "a window.ini was written under AppData in portable mode"; exit 1 }
          Remove-Item (Join-Path $dir 'portable')
          Write-Host "portable mode: settings landed next to the exe, not in AppData"

      - name: Check what Diagnose X50.bat left on the Desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $desk = [Environment]::GetFolderPath('Desktop')
          if ([string]::IsNullOrEmpty($desk)) { $desk = Join-Path $env:USERPROFILE 'Desktop' }
          Write-Host "Desktop: $desk"
          $folders = @(Get-ChildItem -Path $desk -Directory -Filter 'X50-diagnose-*' -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending)
          if ($folders.Count -eq 0) { Write-Host "No X50-diagnose-* folder on the Desktop"; exit 1 }
          $report = Join-Path $folders[0].FullName 'report.txt'
          if (-not (Test-Path $report)) { Write-Host "No report.txt in $($folders[0].FullName)"; exit 1 }
          Write-Host "=== $report ==="
          Get-Content $report | Write-Host
          Write-Host "=== files ==="
          Get-ChildItem $folders[0].FullName | Format-Table Name, Length

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
          if-no-files-found: error
